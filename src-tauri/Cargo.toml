[package]
name = "win-island"
version = "0.1.0"
description = "Dynamic Island para Windows"
authors = ["Kevin Leiva"]
edition = "2024"

# wiri-hook (relé de Claude Code) es un paquete aparte: así no pasa por el
# build.rs de Tauri, que exige que el relé ya exista como recurso.
[workspace]
members = ["wiri-hook"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "win_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
rand = "0.8"
winreg = "0.55"
windows-core = "0.61"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }

[dependencies.windows]
version = "0.61"
features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
